{% extends 'base.html' %}
{% block title %}Login — Medi-Civic{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-logo mb-3">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted">Sign in to Medi-Civic</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        Don't have an account? <a href="{{ url_for('register') }}" class="fw-medium">Register here</a>
                    </p>
                    <div class="mt-4 p-3 bg-light rounded small">
                        <p class="fw-bold mb-1">Demo Accounts:</p>
                        <p class="mb-0"><code>student1 / student123</code> — Student</p>
                        <p class="mb-0"><code>authority / auth123</code> — Authority</p>
                        <p class="mb-0"><code>admin / admin123</code> — Admin</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
